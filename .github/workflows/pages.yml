name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PRs e branches só validam; publicar fica para o main, um deploy por vez.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || (github.ref == 'refs/heads/main' && 'pages' || format('ref-{0}', github.ref)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /mwds
          REGISTRY_URL: https://wenderu00.github.io/mwds
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out

  # Axe com contraste real e regressão visual, no container do Playwright para a renderização
  # ser sempre a mesma. As capturas de referência vêm do workflow atualizar-capturas.
  qualidade:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Instala o registry num app Next novo, como faz quem consome o DS.
  consumidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run registry:build
        env:
          REGISTRY_URL: http://localhost:4400
      - name: Serve o registry
        run: |
          SERVE_ROOT=public npx tsx scripts/serve-out.ts &
          until curl -fs http://localhost:4400/r/marcio-tokens.json > /dev/null; do sleep 1; done
      - run: npm run smoke

  deploy:
    needs: [build, qualidade, consumidor]
    # O workflow_dispatch numa branch (disparado pelo atualizar-capturas) só valida, não publica.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publica a versão como assets imutáveis: quem instala por esta URL não recebe mudanças da main.
  release:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: versao
        name: Decide se esta versão já foi publicada
        run: |
          VERSAO="v$(node -p "require('./package.json').version")"
          echo "tag=$VERSAO" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSAO" > /dev/null 2>&1; then echo "existe=true" >> "$GITHUB_OUTPUT"; else echo "existe=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.versao.outputs.existe == 'false'
        run: npm ci
      - if: steps.versao.outputs.existe == 'false'
        run: npm run registry:build
        env:
          REGISTRY_URL: https://wenderu00.github.io/mwds
          REGISTRY_ITEMS_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.versao.outputs.tag }}
      - if: steps.versao.outputs.existe == 'false'
        name: Cria o release
        env:
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          awk -v versao="[${TAG#v}]" '/^## \[/ { dentro = index($0, versao) > 0; next } dentro' CHANGELOG.md > notas.md
          gh release create "$TAG" public/r/*.json --target "$GITHUB_SHA" --title "$TAG" --notes-file notas.md
      - if: steps.versao.outputs.existe == 'false'
        run: npm run smoke -- "https://github.com/${{ github.repository }}/releases/download/${{ steps.versao.outputs.tag }}"
